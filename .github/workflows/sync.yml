name: weread2readwise

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run sync script
        env:
          WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          CC_URL: ${{ secrets.CC_URL }}
          CC_ID: ${{ secrets.CC_ID }}
          CC_PASSWORD: ${{ secrets.CC_PASSWORD }}
          COOKIECLOUD_URL: ${{ secrets.CC_URL }}
          COOKIECLOUD_UUID: ${{ secrets.CC_ID }}
          COOKIECLOUD_PASSWORD: ${{ secrets.CC_PASSWORD }}
        run: python main.py
